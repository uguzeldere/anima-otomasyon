# Metin bankası. Otomasyon her paylaşımda en az kullanılmış metni seçer.
# genel: her zaman. Sezon adı (christmas, valentines...): sadece o sezon açıkken.
# baslik: Pinterest başlığı (en fazla 100 karakter)
# aciklama: Pinterest açıklaması (en fazla 500 karakter)
# tweet: X metni (link otomatik eklenir, 220 karakteri geçme)

