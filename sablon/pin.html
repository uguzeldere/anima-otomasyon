<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: Anton; src: url("../fontlar/Anton-Regular.ttf"); }
  @font-face { font-family: Pacifico; src: url("../fontlar/Pacifico-Regular.ttf"); }
  @font-face { font-family: Nunito; src: url("../fontlar/Nunito.ttf"); font-weight: 200 1000; }
  :root { --zemin: {{ZEMIN}}; --vurgu: {{VURGU}}; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1000px; height: 1500px; overflow: hidden; background: var(--zemin); }
  .pin { position: relative; width: 1000px; height: 1500px; overflow: hidden; background: var(--zemin); }
  .isilti { position: absolute; inset: 0;
            background: radial-gradient(90% 32% at 50% 100%, color-mix(in srgb, var(--vurgu) 28%, transparent), transparent 100%); }
  .foto { position: absolute; inset: 0 0 auto 0; height: 1210px;
          background: url("{{FOTO}}") center 42% / cover no-repeat;
          filter: saturate(1.15) contrast(1.07) brightness(1.04); }
  .golge { position: absolute; left: 0; right: 0; top: 760px; height: 460px;
           background: linear-gradient(to bottom, transparent 0%, color-mix(in srgb, var(--zemin) 55%, transparent) 45%, var(--zemin) 100%); }
  .logo { position: absolute; top: 34px; right: 34px; width: 132px; height: 132px; border-radius: 10px;
          background: #fff url("../marka/logo.png") center / cover no-repeat; background-origin: padding-box; background-clip: padding-box; border: 4px solid #fff;
          box-shadow: 0 10px 28px rgba(0,0,0,.35); }
  .yazi { position: absolute; left: 60px; right: 60px; bottom: 120px; text-align: center; }
  .ana { font-family: Anton; color: #fff; text-transform: uppercase; line-height: .98; letter-spacing: 1px;
         font-size: {{ANA_PX}}px; text-shadow: 0 4px 18px rgba(0,0,0,.45); }
  .el { font-family: Pacifico; color: var(--vurgu); font-size: {{EL_PX}}px; line-height: 1.1;
        transform: rotate(-4deg); margin-top: -6px; text-shadow: 0 3px 12px rgba(0,0,0,.5); }
  .alt { position: absolute; left: 0; right: 0; bottom: 46px; text-align: center;
         font-family: Nunito; font-weight: 800; font-size: 22px; letter-spacing: 5px; text-transform: uppercase;
         color: rgba(255,255,255,.82); }
  .alt::before, .alt::after { content: ""; display: inline-block; width: 60px; height: 2px; background: var(--vurgu);
         vertical-align: middle; margin: 0 18px; opacity: .9; }
</style></head>
<body><div class="pin">
  <div class="foto"></div>
  <div class="golge"></div>
  <div class="isilti"></div>
  <div class="logo"></div>
  <div class="yazi">
    <div class="ana">{{ANA}}</div>
    <div class="el">{{EL}}</div>
  </div>
  <div class="alt">animacommonsouls.etsy.com</div>
</div></body></html>
