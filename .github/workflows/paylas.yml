name: Paylas

on:
  workflow_dispatch: {}      # Actions sekmesinden elle de calistirilabilir

permissions:
  contents: write            # gecmis.csv'yi geri kaydetmek icin

concurrency: paylas

jobs:
  paylas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt || { sleep 30; pip install -r requirements.txt; }
      - run: google-chrome --version   # pin gorseli icin (runner'da hazir)
      - name: Buffer'a zamanla
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          CANLI: ${{ vars.CANLI }}
          PINTEREST_DOGRUDAN: ${{ vars.PINTEREST_DOGRUDAN }}   # 1 = Buffer'siz Pinterest (pinterest.py)
          PINTEREST_API: ${{ vars.PINTEREST_API }}             # bos = canli API
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_SECRET_TOKEN }}             # yeni refresh token'i secret'a yazmak icin
        run: python paylas.py
      - name: Gecmisi kaydet
        run: |
          git config user.name "anima-bot"
          git config user.email "anima-bot@users.noreply.github.com"
          [ -f gecmis.csv ] || exit 0
          git add gecmis.csv
          if ! git diff --cached --quiet; then
            git commit -m "gecmis: $(date -u +%F)"
            git push
          fi
